<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT – Sample</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script defer src="assets/js/utils.js"></script>
  <script defer src="assets/js/visits.js"></script>
  <script defer src="assets/js/samples.js"></script>
  <script defer src="assets/js/ui-sample.js"></script>
</head>
<body>
  <header class="fk-header">
    <h1 id="sample-title">Sample</h1>
    <div id="sample-meta"></div>
  </header>

  <main class="fk-main">
    <form id="sample-form">
      <div class="fk-field">
        <label>Window Type</label>
        <select id="window-type"></select>
      </div>

      <div class="fk-field">
        <label>Elevation</label>
        <input id="elevation" type="text" />
      </div>

      <div class="fk-field">
        <label>Product Type</label>
        <input id="product-type" type="text" />
      </div>

      <div class="fk-field">
        <label>Manufacturer</label>
        <input id="manufacturer" type="text" />
      </div>

      <div class="fk-field">
        <label>Result</label>
        <select id="result">
          <option value="PASS">PASS</option>
          <option value="FAIL">FAIL</option>
        </select>
      </div>

      <div class="fk-field">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="fk-actions">
        <button type="button" id="save-sample-btn">Save</button>
        <button type="button" id="delete-sample-btn">Delete</button>
        <button type="button" id="duplicate-sample-btn">Duplicate</button>
        <button type="button" id="back-to-visit-btn">Back to Visit</button>
      </div>
    </form>
  </main>
</body>
</html>
