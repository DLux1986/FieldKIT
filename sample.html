<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT – Sample</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/bee-theme.css">
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = new URL("sample-entry.html", window.location.href);

    for (const [key, value] of params.entries()) {
      if (key === "sample_id" || key === "sampleId") {
        target.searchParams.set("sample_id", value);
      } else {
        target.searchParams.set(key, value);
      }
    }

    window.location.replace(target.toString());
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=sample-entry.html" />
  </noscript>
</head>
<body>
  <p>Redirecting to sample-entry.html...</p>
</body>
</html>
