<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT – Project Catalog</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/ui-project-catalog.js"></script>
  
</head>

<body>

  <!-- HEADER -->
  <header class="fk-header">
    <h1>Project Catalog</h1>
  </header>

  <main class="fk-main">

    <!-- FILTER BAR -->
    <section class="fk-filter-bar">

      <div class="fk-filter-group">
        <label for="filter-pm">PM</label>
        <select id="filter-pm">
          <option value="">All PMs</option>
        </select>
      </div>

      <div class="fk-filter-group">
        <label for="filter-client">Client</label>
        <select id="filter-client">
          <option value="">All Clients</option>
        </select>
      </div>

      <div class="fk-filter-group">
        <label for="filter-visits">Visits</label>
        <select id="filter-visits">
          <option value="">All</option>
          <option value="has">Has Visits</option>
          <option value="none">No Visits</option>
        </select>
      </div>

      <div class="fk-filter-group">
        <label for="project-search">Search</label>
        <input id="project-search" type="text" placeholder="Search projects…">
      </div>

      <button id="filter-clear" class="fk-clear-btn">Clear</button>

    </section>

    <!-- PROJECT DETAILS PANE -->
    <section id="project-details-pane" class="fk-details hidden">
      <h2 id="details-name"></h2>

      <p><strong>ID:</strong> <span id="details-id"></span></p>
      <p><strong>PM:</strong> <span id="details-pm"></span></p>
      <p><strong>Client:</strong> <span id="details-client"></span></p>
      <p><strong>Address:</strong> <span id="details-address"></span></p>
      <p><strong>Total Visits:</strong> <span id="details-visits"></span></p>

      <h3>Visits</h3>
      <ul id="details-visit-list"></ul>

      <button id="details-open">Open Project</button>
    </section>

    <!-- PROJECT TABLE -->
    <section class="fk-table-section">
      <table class="fk-project-table">
        <thead>
          <tr>
            <th data-col="id">ID</th>
            <th data-col="name">Name</th>
            <th data-col="pm">PM</th>
            <th data-col="visits">Visits</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="project-table-body"></tbody>
      </table>
    </section>

  </main>

  <!-- CALENDAR LINK MODAL -->
  <div id="calendar-link-modal" class="fk-modal hidden">
    <div class="fk-modal-content">
      <h2>Link Calendar Event</h2>

      <p id="calendar-link-event-title"></p>
      <p id="calendar-link-event-time"></p>

      <label>Assign to Project</label>
      <select id="calendar-link-project-select"></select>

      <div class="fk-modal-actions">
        <button id="calendar-link-save-btn">Save</button>
        <button id="calendar-link-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
