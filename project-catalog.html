<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Project Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="fk-header">
    <h1>Project Catalog</h1>
    <input id="project-search" placeholder="Search projects…">
  </header>

  <main>
    <table class="fk-project-table">
      <thead>
        <tr>
          <th>Project ID</th>
          <th>Name</th>
          <th>Client</th>
          <th>Manager</th>
          <th>Address</th>
          <th>Visits</th>
          <th>Open</th>
        </tr>
      </thead>
      <tbody id="project-table-body"></tbody>
    </table>
  </main>

  <script src="data/projects.js"></script>
  <script src="data/visits.js"></script>
  <script src="ui-project-catalog.js"></script>
</body>
</html>
