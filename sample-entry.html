<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample Entry</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/bee-theme.css">
</head>
<!-- Floating Timer Panel -->
<div id="timerPanel" class="fk-floating hidden">
  <div class="fk-floating-header">
    <span>Test Timer</span>
    <button id="timerCloseBtn">&times;</button>
  </div>
  <iframe src="tools/test-timers.html"></iframe>
</div>

<!-- Button to open the panel -->
<button id="timerOpenBtn" class="fk-floating-open-btn">Timer</button>

<body>

<h1 id="pageTitle">Test Sample Data</h1>

<!-- Project Header -->
<div class="proj-header">
  <p><strong>Project:</strong> <span id="projName"></span></p>
  <p><strong>Sample ID:</strong> <span id="sampleId">—</span></p>
  <p><strong>Visit Type:</strong> <span id="visitTypeLabel">—</span></p>
</div>

<!-- Floating Tools Panel (unchanged) -->
<div id="fk-floating-tools">
  <div id="fk-tools-header">
    <span>Tools</span>
    <button id="fk-tools-toggle">−</button>
  </div>
</div>

<!-- NEW SAMPLE ENTRY FORM -->
<form id="sampleEntryForm" class="form-grid">

  <!-- SAMPLE ID (readonly) -->
  <label>
    Sample ID
    <input id="sampleIdField" type="text" readonly>
  </label>

  <!-- TEST DATE -->
  <label>
    Test Date
    <input id="testDate" type="date">
  </label>

  <label>
    Sample Number
    <input id="sampleNumber" type="number" min="1" step="1" placeholder="1">
  </label>

  <!-- TEST TIME -->
  <label>
    Test Time
    <input id="testTime" type="time">
  </label>

  <label>
    Test Number
    <input id="testNumber" type="number" min="1" step="1" placeholder="1">
  </label>

  <!-- RESULT -->
  <label>
    Result
    <select id="result">
      <option value="PASS">PASS</option>
      <option value="FAIL">FAIL</option>
    </select>
  </label>

  <!-- SAMPLE DETAILS -->
  <h2 class="section-header">Sample Details</h2>

  <label>
    Manufacturer
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <input id="manufacturer" list="manufacturerOptions" placeholder="Type or select" style="flex:1;">
      <button id="showManufacturerOptionsBtn" type="button" class="btn btn-line">Show All</button>
    </div>
    <datalist id="manufacturerOptions"></datalist>
  </label>

  <label>
    Height (in)
    <input id="height_in" type="number" step="0.5" placeholder="48.0">
  </label>

  <label>
    System Type
    <select id="systemType">
      <option value="">Select system type</option>
      <optgroup label="Windows">
        <option value="FIXD">Fixed Window</option>
        <option value="AWNG">Awning Window</option>
        <option value="CASE">Casement Window</option>
        <option value="HUNG">Single / Double Hung</option>
        <option value="SLDR">Sliding Window</option>
        <option value="TILT">Tilt-Turn Window</option>
        <option value="PCTR">Picture Window</option>
        <option value="PIVT">Pivot Window</option>
        <option value="CWOF">Curtain Wall (Operable Fenestration)</option>
        <option value="CWFX">Curtain Wall (Fixed)</option>
        <option value="WWAL">Window Wall</option>
        <option value="STFR">Storefront System</option>
      </optgroup>
      <optgroup label="Doors">
        <option value="SING">Single Swing Door</option>
        <option value="DUBL">Double Swing Door</option>
        <option value="SLGD">Sliding Glass Door</option>
        <option value="TDRR">Terrace Door</option>
      </optgroup>
    </select>
  </label>

  <label>
    Width (in)
    <input id="width_in" type="number" step="0.5" placeholder="84.5">
  </label>

  <label>
    Series / Model
    <input id="seriesModel" list="seriesModelOptions" placeholder="Type or select">
    <datalist id="seriesModelOptions"></datalist>
  </label>

  <label>
    Configuration
    <input id="configuration" type="text" placeholder="XOX / OXO / etc">
  </label>

  <!-- SAMPLE LOCATION -->
  <h2 class="section-header">Sample Location</h2>

  <label>
    Elevation
    <input id="elevation" type="text" placeholder="Courtyard North">
  </label>

  <label>
    Unit Number
    <input id="unitNumber" type="text" placeholder="A-101">
  </label>

  <label>
    Floor Level
    <input id="floorLevel" type="text" placeholder="1st Floor">
  </label>

  <label>
    Description
    <input id="locationDescription" type="text" placeholder="bedroom / stairway hall / etc">
  </label>

  <!-- TEST PARAMETERS -->
  <h2 class="section-header">Test Parameters</h2>

  <label>
    Procedure
    <select id="procedure">
      <option value="B">Procedure B</option>
      <option value="A">Procedure A</option>
    </select>
  </label>

  <label>
    Pressure (PSF)
    <input id="pressure_psf" type="number" step="0.01">
  </label>

  <label>
    Pressure (inWC)
    <input id="pressure_inwc" type="number" step="0.01">
  </label>

  <!-- TEST CONDITIONS -->
  <h2 class="section-header">Test Conditions
  <button id="collectWeatherBtn" type="button" class="btn btn-line">Collect Weather Data</button>
  </h2>
  <label>
    Atmospheric Temp (°F)
    <input id="atmosphericTemp_f" type="number">
  </label>

  <label>
    Barometric Pressure (inHg)
    <input id="barometricPressure_inhg" type="number" step="0.01">
  </label>

  <label>
    Wind Speed (mph)
    <input id="windSpeed_mph" type="number">
  </label>

  <label>
    Wind Direction
    <input id="windDirection" type="text" placeholder="NNW">
  </label>

  <!-- PHOTO UPLOADS -->
  <h2 class="section-header">Photos</h2>

  <label>
    Interior Chamber
    <input id="photoInterior" type="file" multiple>
  </label>

  <label>
    Exterior Rack
    <input id="photoExterior" type="file" multiple>
  </label>

  <label>
    Gauges
    <input id="photoGauges" type="file" multiple>
  </label>

  <!-- FAILURE BLOCK -->
  <div id="failureBlock" style="display:none;">
    <h2 class="section-header">Failure Details</h2>

    <label>
      Cycle Failure Occurred
      <select id="cycleFailureOccurred">
        <option value=""></option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    <label>
      Time of Failure (mm:ss)
      <input id="timeOfFailure" type="text" placeholder="03:30">
    </label>

    <label>
      Mode of Failure
      <select id="modeOfFailure">
        <option value=""></option>
        <option value="Installation">Installation</option>
        <option value="Product">Product</option>
      </select>
    </label>

    <label>
      Failure Location
      <input id="failureLocation" type="text">
    </label>

    <label>
      Remediation Performed
      <select id="remediationPerformed">
        <option value=""></option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </label>

    <label>
      Remediation Description
      <textarea id="remediationDescription"></textarea>
    </label>

    <label>
      Failure Location Photos
      <input id="photoFailure" type="file" multiple>
    </label>
  </div>

  <!-- NOTES -->
  <h2 class="section-header">Technician Notes</h2>
  <textarea id="notes"></textarea>

</form>

<!-- ACTION BUTTONS -->
<button id="saveBtn" class="btn btn-primary">Save Sample</button>
<button id="cancelBtn" class="btn btn-line">Cancel</button>
<script>
  const panel = document.getElementById("timerPanel");
  const openBtn = document.getElementById("timerOpenBtn");
  const closeBtn = document.getElementById("timerCloseBtn");

  openBtn.onclick = () => panel.classList.remove("hidden");
  closeBtn.onclick = () => panel.classList.add("hidden");
</script>

<!-- EXISTING SCRIPT MOVED TO BOTTOM (unchanged) -->
<script type="module">
  import { SampleEntryController } from "./controllers/sample-entry-controller.js";
  import { generateSampleId } from "./controllers/idGenerator.js";
  import { fetchWeatherForAddress } from "./assets/js/weather.js";

  console.log("🧪 BEE FieldKIT — Sample Entry Loaded");

  const params = new URLSearchParams(location.search);
  const projectId = params.get("projectId");
  const projectName = params.get("projectName") || "";
  const projectAddress = params.get("address") || "";
  const sampleParam = params.get("sample");
  const visitId = params.get("visitId");

  function loadVisits() {
    return JSON.parse(localStorage.getItem("visits") || "[]");
  }

  function getVisitTypeLabel(currentVisitId, currentEditingSample) {
    const visits = loadVisits();
    const targetId = currentVisitId || currentEditingSample?.visit_id || currentEditingSample?.visitId || "";
    const visit = visits.find(item => String(item.id) === String(targetId) || String(item.visit_id) === String(targetId));
    if (!visit) return "—";
    return `${visit.test_type || ""}${visit.visit_number || ""}`;
  }

  async function loadWindowProducts() {
    const response = await fetch("assets/data/window_products.json");
    if (!response.ok) throw new Error("Failed to load window products data");
    return response.json();
  }

  async function populateManufacturers() {
    const manufacturerInput = document.getElementById("manufacturer");
    const showManufacturerOptionsBtn = document.getElementById("showManufacturerOptionsBtn");
    const seriesModelInput = document.getElementById("seriesModel");
    const manufacturerOptions = document.getElementById("manufacturerOptions");
    const seriesModelOptions = document.getElementById("seriesModelOptions");
    if (!manufacturerInput) return;

    try {
      const data = await loadWindowProducts();
      const manufacturers = Array.isArray(data.manufacturers) ? data.manufacturers : [];
      const byManufacturer = data.by_manufacturer || {};

      const populateDatalist = (datalist, values) => {
        if (!datalist) return;
        datalist.innerHTML = "";
        values.forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          datalist.appendChild(option);
        });
      };

      populateDatalist(manufacturerOptions, manufacturers);

      const populateDependentOptions = (manufacturerName) => {
        const manufacturerData = byManufacturer[manufacturerName] || {};
        const productTypes = Array.isArray(manufacturerData.product_types) ? manufacturerData.product_types : [];
        const series = Array.isArray(manufacturerData.series) ? manufacturerData.series : [];

        populateDatalist(seriesModelOptions, series);
      };

      manufacturerInput.addEventListener("input", event => {
        populateDependentOptions(event.target.value || "");
      });

      showManufacturerOptionsBtn?.addEventListener("click", () => {
        manufacturerInput.value = "";
        populateDependentOptions("");
        manufacturerInput.focus();
      });

      const defaultManufacturer = manufacturers.find(name => {
        const manufacturerData = byManufacturer[name] || {};
        const productTypes = Array.isArray(manufacturerData.product_types) ? manufacturerData.product_types : [];
        const series = Array.isArray(manufacturerData.series) ? manufacturerData.series : [];
        return productTypes.length > 0 || series.length > 0;
      }) || manufacturers[0] || "";

      if (defaultManufacturer) {
        manufacturerInput.value = defaultManufacturer;
        populateDependentOptions(defaultManufacturer);
      } else {
        populateDependentOptions("");
      }
    } catch (err) {
      console.error("Unable to load manufacturers", err);
      if (manufacturerInput) manufacturerInput.value = "";
      if (seriesModelInput) seriesModelInput.value = "";
    }
  }

  document.getElementById("projName").textContent = projectName;

  let samples = JSON.parse(localStorage.getItem(`project_${projectId}_samples`)) || [];
  let editingSample = null;
  const visitTypeLabelEl = document.getElementById("visitTypeLabel");
  const systemTypeEl = document.getElementById("systemType");
  const sampleNumberEl = document.getElementById("sampleNumber");
  const testNumberEl = document.getElementById("testNumber");
  const sampleIdSpan = document.getElementById("sampleId");
  const sampleIdField = document.getElementById("sampleIdField");
  let controller = null;

  function parseSampleIdValue(value) {
    const match = String(value || "").match(/^([A-Z0-9]+)-S(\d{2})T(\d{2})$/i);
    if (match) {
      return {
        systemType: match[1].toUpperCase(),
        sampleNumber: Number(match[2]),
        testNumber: Number(match[3])
      };
    }

    const numericMatch = String(value || "").match(/^(\d+)$/);
    if (numericMatch) {
      return {
        systemType: "",
        sampleNumber: Number(numericMatch[1]),
        testNumber: 1
      };
    }

    return null;
  }

  function getNextSampleNumberForSystemType(systemType) {
    const numbers = samples
      .map(item => parseSampleIdValue(item.sampleId || item.sample_id || ""))
      .filter(parsed => parsed && parsed.systemType === systemType)
      .map(parsed => parsed.sampleNumber);

    return numbers.length ? Math.max(...numbers) + 1 : 1;
  }

  function syncSampleIdPreview() {
    const systemType = (systemTypeEl?.value || "").trim().toUpperCase();
    const sampleNumber = Number(sampleNumberEl?.value) || 1;
    const testNumber = Number(testNumberEl?.value) || 1;

    if (!systemType) {
      if (sampleIdSpan) sampleIdSpan.textContent = "";
      if (sampleIdField) sampleIdField.value = "";
      if (controller) {
        controller.state.sampleId = "";
      }
      return;
    }

    const generatedId = generateSampleId(systemType, sampleNumber, testNumber);
    if (sampleIdSpan) sampleIdSpan.textContent = generatedId;
    if (sampleIdField) sampleIdField.value = generatedId;
    if (controller) {
      controller.state.sampleId = generatedId;
    }
  }

  if (sampleParam === "new") {
    editingSample = { sample_id: "" };
    const defaultSystemType = systemTypeEl?.options[1]?.value || "FIXD";
    systemTypeEl.value = defaultSystemType;
    sampleNumberEl.value = getNextSampleNumberForSystemType(defaultSystemType);
    testNumberEl.value = 1;
  } else {
    const id = Number(sampleParam);
    editingSample = samples.find(s => s.sampleId === id || s.sample_id === id);

    if (!editingSample) {
      alert("Sample not found.");
      history.back();
    }

    const parsed = parseSampleIdValue(editingSample.sampleId || editingSample.sample_id || "");
    if (parsed) {
      if (parsed.systemType) {
        systemTypeEl.value = parsed.systemType;
      } else if (editingSample.window_type) {
        systemTypeEl.value = editingSample.window_type;
      }
      sampleNumberEl.value = parsed.sampleNumber || 1;
      testNumberEl.value = parsed.testNumber || 1;
    } else {
      systemTypeEl.value = editingSample.window_type || systemTypeEl?.options[1]?.value || "FIXD";
      sampleNumberEl.value = Number(editingSample.sample_number) || 1;
      testNumberEl.value = Number(editingSample.test_number) || 1;
    }

    document.getElementById("pageTitle").textContent = "Edit Sample";
  }

  if (visitTypeLabelEl) {
    visitTypeLabelEl.textContent = getVisitTypeLabel(visitId, editingSample);
  }

  [systemTypeEl, sampleNumberEl, testNumberEl].forEach(el => {
    el?.addEventListener("input", syncSampleIdPreview);
    el?.addEventListener("change", syncSampleIdPreview);
  });

  function loadGlobalMeta() {
    return JSON.parse(localStorage.getItem("fieldkit_metadata_global")) || {};
  }

  function loadProjectMeta(id) {
    return JSON.parse(localStorage.getItem(`project_${id}_metadata`)) || {};
  }

  function getMergedMetadata() {
    const global = loadGlobalMeta();
    const project = loadProjectMeta(projectId);
    return { ...global, ...project };
  }

  function applyMetadata() {
    const meta = getMergedMetadata();

    if (meta.testDate) document.getElementById("testDate").value = meta.testDate;
    if (meta.temp_f) document.getElementById("atmosphericTemp_f").value = meta.temp_f;
    if (meta.wind_mph) document.getElementById("windSpeed_mph").value = meta.wind_mph;
    if (meta.wind_dir) document.getElementById("windDirection").value = meta.wind_dir;
    if (meta.barometric) document.getElementById("barometricPressure_inhg").value = meta.barometric;
  }

  applyMetadata();
  await populateManufacturers();

  const header = document.getElementById("fk-tools-header");
  const toggleBtn = document.getElementById("fk-tools-toggle");
  const body = document.getElementById("fk-tools-body");

  toggleBtn.addEventListener("click", () => {
    const isHidden = body.style.display === "none";
    body.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "−" : "+";
  });

  let offsetX = 0, offsetY = 0, dragging = false;

  header.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - panel.offsetLeft;
    offsetY = e.clientY - panel.offsetTop;
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    panel.style.left = `${e.clientX - offsetX}px`;
    panel.style.top = `${e.clientY - offsetY}px`;
    panel.style.bottom = "auto";
    panel.style.right = "auto";
  });

  document.addEventListener("mouseup", () => dragging = false);

  document.querySelectorAll(".fk-tool-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tool = btn.dataset.tool;

      if (tool === "timers") {
        window.open("tools/test-timers/index.html", "_blank");
      }

      if (tool === "weather") {
        window.open("tools/weather/index.html", "_blank");
      }
    });
  });

  document.getElementById("cancelBtn").addEventListener("click", () => {
    const url = new URL("project.html", location.href);
    url.searchParams.set("projectId", projectId);
    url.searchParams.set("projectName", projectName);
    location.href = url.toString();
  });

// -----------------------------
// INITIAL SETUP
// -----------------------------
console.log("🔗 FieldKIT — Binding Layer Loaded");

// Create controller
controller = new SampleEntryController(projectId, {
  saveSample: async (data) => {
    // You can replace this with IndexedDB or API later
    let samples = JSON.parse(localStorage.getItem(`project_${projectId}_samples`)) || [];

    if (sampleParam === "new") {
      samples.push(data);
    } else {
      const index = samples.findIndex(s => s.sampleId === data.sampleId);
      samples[index] = data;
    }

    localStorage.setItem(`project_${projectId}_samples`, JSON.stringify(samples));
  }
});

// -----------------------------
// WEATHER DATA
// -----------------------------
const collectWeatherBtn = document.getElementById("collectWeatherBtn");

collectWeatherBtn?.addEventListener("click", async () => {
  const apiKey = localStorage.getItem("fieldkit_weather_api_key") || prompt("Enter your WeatherAPI.com API key:");
  if (!apiKey) {
    alert("A WeatherAPI.com API key is required.");
    return;
  }
  localStorage.setItem("fieldkit_weather_api_key", apiKey);

  const meta = getMergedMetadata();
  const addressLine = [
    projectAddress,
    meta.address,
    meta.projectAddress,
    meta.project_address,
    meta.locationAddress,
    meta.location_address,
    document.getElementById("elevation")?.value,
    document.getElementById("unitNumber")?.value,
    document.getElementById("floorLevel")?.value,
    document.getElementById("locationDescription")?.value
  ].filter(Boolean).join(" ") || prompt("Enter an address or ZIP code for weather lookup:");

  if (!addressLine) {
    alert("An address or ZIP code is required for weather lookup.");
    return;
  }

  collectWeatherBtn.disabled = true;
  collectWeatherBtn.textContent = "Fetching...";

  try {
    const weather = await fetchWeatherForAddress({ apiKey, addressLine });

    const setField = (id, value, path) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = value ?? "";
      controller.updateField(path, value ?? "");
    };

    setField("atmosphericTemp_f", weather.temp_f, "testParameters.atmosphericTemp_f");
    setField("barometricPressure_inhg", weather.pressure_in, "testParameters.barometricPressure_inhg");
    setField("windSpeed_mph", weather.wind_mph, "testParameters.windSpeed_mph");
    setField("windDirection", weather.wind_dir, "testParameters.windDirection");
  } catch (err) {
    console.error("Weather lookup failed", err);
    alert("Weather lookup failed. Check the API key and address.");
  } finally {
    collectWeatherBtn.disabled = false;
    collectWeatherBtn.textContent = "Collect Weather Data";
  }
});

// -----------------------------
// FIELD BINDING HELPER
// -----------------------------
function bindField(id, path) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener("input", () => {
    controller.updateField(path, el.value);
  });
}

  function bindCalculatedField(sourceId, targetId, transform) {
    const sourceEl = document.getElementById(sourceId);
    const targetEl = document.getElementById(targetId);

    if (!sourceEl || !targetEl) return;

    const sync = () => {
      const value = Number(sourceEl.value);
      if (!Number.isFinite(value)) {
        targetEl.value = "";
        controller.updateField("testParameters.pressure_inwc", "");
        return;
      }

      const computed = Number(transform(value).toFixed(2));
      targetEl.value = computed;
      controller.updateField("testParameters.pressure_inwc", computed);
    };

    sourceEl.addEventListener("input", sync);
    sourceEl.addEventListener("change", sync);
  }

  function bindFileUpload(id, category) {
    const el = document.getElementById(id);
    if (!el) return;

    el.addEventListener("change", () => {
      const files = Array.from(el.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        controller.addPhoto(category, url);
      });
    });
  }

// -----------------------------

bindField("testDate", "testDate");
bindField("testTime", "testTime");
bindField("result", "result");

bindField("productType", "sampleDetails.productType");
bindField("manufacturer", "sampleDetails.manufacturer");
bindField("seriesModel", "sampleDetails.seriesModel");
bindField("width_in", "sampleDetails.width_in");
bindField("height_in", "sampleDetails.height_in");
bindField("configuration", "sampleDetails.configuration");

bindField("elevation", "sampleLocation.elevation");
bindField("unitNumber", "sampleLocation.unitNumber");
bindField("floorLevel", "sampleLocation.floorLevel");
bindField("locationDescription", "sampleLocation.description");

bindField("procedure", "testParameters.procedure");
bindField("pressure_psf", "testParameters.pressure_psf");
bindCalculatedField("pressure_psf", "pressure_inwc", value => value * 0.19222);
bindField("atmosphericTemp_f", "testParameters.atmosphericTemp_f");
bindField("barometricPressure_inhg", "testParameters.barometricPressure_inhg");
bindField("windSpeed_mph", "testParameters.windSpeed_mph");
bindField("windDirection", "testParameters.windDirection");

bindField("notes", "notes");

// Failure block
bindField("cycleFailureOccurred", "failure.cycleFailureOccurred");
bindField("timeOfFailure", "failure.timeOfFailure");
bindField("modeOfFailure", "failure.modeOfFailure");
bindField("failureLocation", "failure.failureLocation");
bindField("remediationPerformed", "failure.remediationPerformed");
bindField("remediationDescription", "failure.remediationDescription");

// -----------------------------
// PHOTO UPLOADS
// -----------------------------
bindFileUpload("photoInterior", "interiorChamber");
bindFileUpload("photoExterior", "exteriorRack");
bindFileUpload("photoGauges", "gauges");
bindFileUpload("photoFailure", "failureLocation");

// -----------------------------
// CONDITIONAL FAIL BLOCK
// -----------------------------
const resultEl = document.getElementById("result");
const failureBlock = document.getElementById("failureBlock");

resultEl.addEventListener("change", () => {
  const fail = resultEl.value === "FAIL";
  failureBlock.style.display = fail ? "block" : "none";
  controller.updateField("result", resultEl.value);

  const notesEl = document.getElementById("notes");
  if (!notesEl) return;

  if (resultEl.value === "PASS") {
    notesEl.value = "No penetration observed at the specified test pressure.";
    controller.updateField("notes", notesEl.value);
  }
});

// -----------------------------
// SAMPLE ID SYNC
// -----------------------------
syncSampleIdPreview();

// -----------------------------
// SAVE BUTTON
// -----------------------------
function clearValidationHighlights() {
  document.querySelectorAll(".fk-field-error").forEach(el => {
    el.classList.remove("fk-field-error");
  });
}

function highlightValidationErrors(errors) {
  clearValidationHighlights();

  const issuePaths = (errors || []).map(issue => issue.path || []);

  issuePaths.forEach(pathSegments => {
    if (!pathSegments.length) return;

    const fieldId = pathSegments[0];
    const control = document.getElementById(fieldId);
    if (!control) return;

    control.classList.add("fk-field-error");
  });
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  clearValidationHighlights();
  syncSampleIdPreview();
  const result = await controller.save();

  if (!result.success) {
    const issues = result.errors?.issues || [];
    highlightValidationErrors(issues);
    alert("Validation failed — check required fields.");
    console.error(result.errors);
    return;
  }

  const url = new URL("project.html", location.href);
  url.searchParams.set("projectId", projectId);
  url.searchParams.set("projectName", projectName);
  location.href = url.toString();
});

// -----------------------------
