<!-- Floating Timer Panel -->
<div id="timerPanel" class="fk-floating hidden">

<!-- Button to open the panel -->
<button id="timerOpenBtn" class="fk-floating-open-btn">Timer</button>

<!-- Timer state manager -->
<script>
  // Restore timer panel state from sessionStorage
  const TIMER_OPEN_KEY = "fieldkit_timer_panel_open";
  const timerPanel = document.getElementById("timerPanel");
  const timerOpenBtn = document.getElementById("timerOpenBtn");
  const timerCloseBtn = document.getElementById("timerCloseBtn");

  // Restore open state on page load
  if (sessionStorage.getItem(TIMER_OPEN_KEY) === "true") {
    timerPanel.classList.remove("hidden");
  }

  // Open button
  timerOpenBtn.addEventListener("click", () => {
    timerPanel.classList.remove("hidden");
    sessionStorage.setItem(TIMER_OPEN_KEY, "true");
  });

  // Close button
  timerCloseBtn.addEventListener("click", () => {
    timerPanel.classList.add("hidden");
    sessionStorage.setItem(TIMER_OPEN_KEY, "false");
  });

  // Also close on outside click
  timerPanel.addEventListener("click", e => {
    if (e.target === timerPanel) {
      timerPanel.classList.add("hidden");
      sessionStorage.setItem(TIMER_OPEN_KEY, "false");
    }
  });

  // Dragging logic (same as before)
  const header = timerPanel.querySelector(".fk-floating-header");
  let offsetX = 0, offsetY = 0, dragging = false;

  header.addEventListener("mousedown", e => {
    dragging = true;
    offsetX = e.clientX - timerPanel.offsetLeft;
    offsetY = e.clientY - timerPanel.offsetTop;
    e.preventDefault();
  });

  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    timerPanel.style.left = (e.clientX - offsetX) + "px";
    timerPanel.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });

  // Save position on beforeunload so it persists across navigation
  window.addEventListener("beforeunload", () => {
    sessionStorage.setItem("fieldkit_timer_x", timerPanel.style.left);
    sessionStorage.setItem("fieldkit_timer_y", timerPanel.style.top);
  });

  // Restore position on page load
  const savedX = sessionStorage.getItem("fieldkit_timer_x");
  const savedY = sessionStorage.getItem("fieldkit_timer_y");
  if (savedX && savedY) {
    timerPanel.style.left = savedX;
    timerPanel.style.top = savedY;
  }
</script>

<!-- EXISTING SCRIPT MOVED TO BOTTOM (unchanged) -->
<script type="module">
  import { SampleEntryController } from "./controllers/sample-entry-controller.js";
  import { generateSampleId } from "./controllers/idGenerator.js";
  import { fetchWeatherForAddress } from "./assets/js/weather.js";

  console.log("🧪 BEE FieldKIT — Sample Entry Loaded");

  const params = new URLSearchParams(location.search);
  const projectId = params.get("projectId") || params.get("project_id") || sessionStorage.getItem("fieldkit_preload_project_id") || "";
  const projectName = params.get("projectName") || "";
  const projectAddress = params.get("address") || "";
  const sampleParam = params.get("sample") || params.get("sampleId") || params.get("sample_id") || "new";
  const visitId = params.get("visitId");

  function loadVisits() {
    return JSON.parse(localStorage.getItem("visits") || "[]");
  }

  function getVisitTypeLabel(currentVisitId, currentEditingSample) {
    const visits = loadVisits();
    const targetId = currentVisitId || currentEditingSample?.visit_id || currentEditingSample?.visitId || "";
    const visit = visits.find(item => String(item.id) === String(targetId) || String(item.visit_id) === String(targetId));
    if (!visit) return "—";
    return `${visit.test_type || ""}${visit.visit_number || ""}`;
  }

  function toLegacySampleShape(sample) {
    const parsed = parseSampleIdValue(sample?.sampleId || sample?.sample_id || "");
    const personnel = sample?.personnel || {};
    const witnesses = sample?.witnesses || {};
    return {
      sample_id: sample?.sampleId || sample?.sample_id || "",
      project_id: sample?.projectId || sample?.project_id || projectId || "",
      visit_id: sample?.visit_id || sample?.visitId || visitId || "",
      lead_technician: personnel?.leadTechnician || sample?.lead_technician || "",
      technician_2: personnel?.technician2 || sample?.technician_2 || "",
      witness_name_1: witnesses?.witness_name_1 || sample?.witness_name_1 || "",
      witness_company_1: witnesses?.witness_company_1 || sample?.witness_company_1 || "",
      witness_role_1: witnesses?.witness_role_1 || sample?.witness_role_1 || "",
      witness_name_2: witnesses?.witness_name_2 || sample?.witness_name_2 || "",
      witness_company_2: witnesses?.witness_company_2 || sample?.witness_company_2 || "",
      witness_role_2: witnesses?.witness_role_2 || sample?.witness_role_2 || "",
      window_type: parsed?.systemType || sample?.window_type || "",
      sample_number: parsed?.sampleNumber || sample?.sample_number || null,
      test_number: parsed?.testNumber || sample?.test_number || null,
      elevation: sample?.sampleLocation?.elevation || sample?.elevation || "",
      product_type: sample?.sampleDetails?.productType || sample?.product_type || "",
      manufacturer: sample?.sampleDetails?.manufacturer || sample?.manufacturer || "",
      result: sample?.result || "",
      notes: sample?.notes || "",
      attachments: [
        ...(sample?.photos?.interiorChamber || []),
        ...(sample?.photos?.exteriorRack || []),
        ...(sample?.photos?.gauges || []),
        ...(sample?.photos?.failureLocation || [])
      ]
    };
  }

  async function loadWindowProducts() {
    const response = await fetch("assets/data/window_products.json");
    if (!response.ok) throw new Error("Failed to load window products data");
    return response.json();
  }

  async function populateManufacturers() {
    const manufacturerInput = document.getElementById("manufacturer");
    const seriesModelInput = document.getElementById("seriesModel");
    const seriesModelOptions = document.getElementById("seriesModelOptions");
    if (!manufacturerInput) return;

    try {
      const data = await loadWindowProducts();
      const manufacturers = Array.isArray(data.manufacturers) ? data.manufacturers : [];
      const byManufacturer = data.by_manufacturer || {};

      const populateDatalist = (datalist, values) => {
        if (!datalist) return;
        datalist.innerHTML = "";
        values.forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          datalist.appendChild(option);
        });
      };

      manufacturerInput.innerHTML = "";
      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = "Select manufacturer";
      manufacturerInput.appendChild(emptyOption);

      manufacturers.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        manufacturerInput.appendChild(option);
      });

      const populateDependentOptions = (manufacturerName) => {
        const manufacturerData = byManufacturer[manufacturerName] || {};
        const productTypes = Array.isArray(manufacturerData.product_types) ? manufacturerData.product_types : [];
        const series = Array.isArray(manufacturerData.series) ? manufacturerData.series : [];

        populateDatalist(seriesModelOptions, series);
      };

      const syncManufacturerDependentOptions = () => {
        populateDependentOptions(manufacturerInput.value || "");
      };

      manufacturerInput.addEventListener("input", syncManufacturerDependentOptions);
      manufacturerInput.addEventListener("change", syncManufacturerDependentOptions);

      const defaultManufacturer = manufacturers.find(name => {
        const manufacturerData = byManufacturer[name] || {};
        const productTypes = Array.isArray(manufacturerData.product_types) ? manufacturerData.product_types : [];
        const series = Array.isArray(manufacturerData.series) ? manufacturerData.series : [];
        return productTypes.length > 0 || series.length > 0;
      }) || manufacturers[0] || "";

      if (defaultManufacturer) {
        manufacturerInput.value = defaultManufacturer;
        populateDependentOptions(defaultManufacturer);
      } else {
        populateDependentOptions("");
      }
    } catch (err) {
      console.error("Unable to load manufacturers", err);
      if (manufacturerInput) manufacturerInput.value = "";
      if (seriesModelInput) seriesModelInput.value = "";
    }
  }

  document.getElementById("projName").textContent = projectName;

  // Load samples from unified localStorage key (from samples.js)
  let samples = JSON.parse(localStorage.getItem("samples") || "[]");
  let editingSample = null;
  const visitTypeLabelEl = document.getElementById("visitTypeLabel");
  const systemTypeEl = document.getElementById("systemType");
  const sampleNumberEl = document.getElementById("sampleNumber");
  const testNumberEl = document.getElementById("testNumber");
  const sampleIdSpan = document.getElementById("sampleId");
  const sampleIdField = document.getElementById("sampleIdField");
  let controller = null;

  function parseSampleIdValue(value) {
    const match = String(value || "").match(/^([A-Z0-9]+)-S(\d{2})T(\d{2})$/i);
    if (match) {
      return {
        systemType: match[1].toUpperCase(),
        sampleNumber: Number(match[2]),
        testNumber: Number(match[3])
      };
    }

    const numericMatch = String(value || "").match(/^(\d+)$/);
    if (numericMatch) {
      return {
        systemType: "",
        sampleNumber: Number(numericMatch[1]),
        testNumber: 1
      };
    }

    return null;
  }

  function getNextSampleNumberForSystemType(systemType) {
    const numbers = samples
      .map(item => parseSampleIdValue(item.sampleId || item.sample_id || ""))
      .filter(parsed => parsed && parsed.systemType === systemType)
      .map(parsed => parsed.sampleNumber);

    return numbers.length ? Math.max(...numbers) + 1 : 1;
  }

  function setSampleIdDisplay(value) {
    if (sampleIdSpan) sampleIdSpan.textContent = value || "";
    if (sampleIdField) sampleIdField.value = value || "";
  }

  function getFinalSampleId() {
    const systemType = (systemTypeEl?.value || "").trim().toUpperCase();
    const sampleNumber = Number(sampleNumberEl?.value) || 1;
    const testNumber = Number(testNumberEl?.value) || 1;

    if (!systemType) {
      return "";
    }

    return generateSampleId(systemType, sampleNumber, testNumber);
  }

  if (sampleParam === "new") {
    editingSample = { sample_id: "" };
    const defaultSystemType = systemTypeEl?.options[1]?.value || "FIXD";
    systemTypeEl.value = defaultSystemType;
    sampleNumberEl.value = getNextSampleNumberForSystemType(defaultSystemType);
    testNumberEl.value = 1;
    setSampleIdDisplay("Pending (assigned on save)");
  } else {
    const id = String(sampleParam);
    editingSample = samples.find(s => String(s.sampleId || s.sample_id || "") === id);

    if (!editingSample) {
      alert("Sample not found.");
      history.back();
    }

    const parsed = parseSampleIdValue(editingSample.sampleId || editingSample.sample_id || "");
    if (parsed) {
      if (parsed.systemType) {
        systemTypeEl.value = parsed.systemType;
      } else if (editingSample.window_type) {
        systemTypeEl.value = editingSample.window_type;
      }
      sampleNumberEl.value = parsed.sampleNumber || 1;
      testNumberEl.value = parsed.testNumber || 1;
    } else {
      systemTypeEl.value = editingSample.window_type || systemTypeEl?.options[1]?.value || "FIXD";
      sampleNumberEl.value = Number(editingSample.sample_number) || 1;
      testNumberEl.value = Number(editingSample.test_number) || 1;
    }

    document.getElementById("pageTitle").textContent = "Edit Sample";
    setSampleIdDisplay(editingSample.sampleId || editingSample.sample_id || "Pending (assigned on save)");
  }

  if (visitTypeLabelEl) {
    visitTypeLabelEl.textContent = getVisitTypeLabel(visitId, editingSample);
  }

  function loadGlobalMeta() {
    return JSON.parse(localStorage.getItem("fieldkit_metadata_global")) || {};
  }

  function loadProjectMeta(id) {
    return JSON.parse(localStorage.getItem(`project_${id}_metadata`)) || {};
  }

  function getMergedMetadata() {
    const global = loadGlobalMeta();
    const project = loadProjectMeta(projectId);
    return { ...global, ...project };
  }

  function applyMetadata() {
    const meta = getMergedMetadata();

    if (meta.testDate) document.getElementById("testDate").value = meta.testDate;
    if (meta.temp_f) document.getElementById("atmosphericTemp_f").value = meta.temp_f;
    if (meta.wind_mph) document.getElementById("windSpeed_mph").value = meta.wind_mph;
    if (meta.wind_dir) document.getElementById("windDirection").value = meta.wind_dir;
    if (meta.barometric) document.getElementById("barometricPressure_inhg").value = meta.barometric;
  }

  applyMetadata();
  await populateManufacturers();

  const toolsPanel = document.getElementById("fk-floating-tools");
  const toolsHeader = document.getElementById("fk-tools-header");
  const toggleBtn = document.getElementById("fk-tools-toggle");
  const toolsBody = document.getElementById("fk-tools-body");

  toggleBtn?.addEventListener("click", () => {
    if (!toolsBody) return;
    const isHidden = toolsBody.style.display === "none";
    toolsBody.style.display = isHidden ? "block" : "none";
    toggleBtn.textContent = isHidden ? "−" : "+";
  });

  let toolsOffsetX = 0;
  let toolsOffsetY = 0;
  let toolsDragging = false;

  toolsHeader?.addEventListener("mousedown", (e) => {
    if (!toolsPanel) return;
    toolsDragging = true;
    toolsOffsetX = e.clientX - toolsPanel.offsetLeft;
    toolsOffsetY = e.clientY - toolsPanel.offsetTop;
  });

  document.addEventListener("mousemove", (e) => {
    if (!toolsDragging || !toolsPanel) return;
    toolsPanel.style.left = `${e.clientX - toolsOffsetX}px`;
    toolsPanel.style.top = `${e.clientY - toolsOffsetY}px`;
    toolsPanel.style.bottom = "auto";
    toolsPanel.style.right = "auto";
  });

  document.addEventListener("mouseup", () => {
    toolsDragging = false;
  });

  document.querySelectorAll(".fk-tool-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tool = btn.dataset.tool;

      if (tool === "timers") {
        window.open("tools/test-timers/index.html", "_blank");
      }

      if (tool === "weather") {
        window.open("tools/weather/index.html", "_blank");
      }
    });
  });

  document.getElementById("cancelBtn").addEventListener("click", () => {
    const url = new URL("project.html", location.href);
    url.searchParams.set("projectId", projectId);
    url.searchParams.set("projectName", projectName);
    location.href = url.toString();
  });

console.log("🔗 FieldKIT — Binding Layer Loaded");

// Create controller
controller = new SampleEntryController(projectId, {
  saveSample: async (data) => {
    // Load samples from unified localStorage key (from samples.js)
    let samples = JSON.parse(localStorage.getItem("samples") || "[]");

    const legacy = toLegacySampleShape(data);
    const persistedSample = { ...data, ...legacy };
    const sampleKey = String(persistedSample.sampleId || persistedSample.sample_id || "");

    const index = samples.findIndex(s => String(s.sampleId || s.sample_id || "") === sampleKey);
    if (index >= 0) {
      samples[index] = { ...samples[index], ...persistedSample };
    } else {
      samples.push(persistedSample);
    }

    // Save to unified localStorage key
    localStorage.setItem("samples", JSON.stringify(samples));
  }
});

collectWeatherBtn?.addEventListener("click", async () => {
  const apiKey = localStorage.getItem("fieldkit_weather_api_key") || prompt("Enter your WeatherAPI.com API key:");
  if (!apiKey) {
    alert("A WeatherAPI.com API key is required.");
    return;
  }
  localStorage.setItem("fieldkit_weather_api_key", apiKey);

  const meta = getMergedMetadata();
  const addressLine = [
    projectAddress,
    meta.address,
    meta.projectAddress,
    meta.project_address,
    meta.locationAddress,
    meta.location_address,
    document.getElementById("elevation")?.value,
    document.getElementById("unitNumber")?.value,
    document.getElementById("floorLevel")?.value,
    document.getElementById("locationDescription")?.value
  ].filter(Boolean).join(" ") || prompt("Enter an address or ZIP code for weather lookup:");

  if (!addressLine) {
    alert("An address or ZIP code is required for weather lookup.");
    return;
  }

  collectWeatherBtn.disabled = true;
  collectWeatherBtn.textContent = "Fetching...";

  try {
    const weather = await fetchWeatherForAddress({ apiKey, addressLine });

    const setField = (id, value, path) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = value ?? "";
      controller.updateField(path, value ?? "");
    };

    setField("atmosphericTemp_f", weather.temp_f, "testParameters.atmosphericTemp_f");
    setField("barometricPressure_inhg", weather.pressure_in, "testParameters.barometricPressure_inhg");
    setField("windSpeed_mph", weather.wind_mph, "testParameters.windSpeed_mph");
    setField("windDirection", weather.wind_dir, "testParameters.windDirection");
  } catch (err) {
    console.error("Weather lookup failed", err);
    alert("Weather lookup failed. Check the API key and address.");
  } finally {
    collectWeatherBtn.disabled = false;
    collectWeatherBtn.textContent = "Collect Weather Data";
  }
});

// -----------------------------
// FIELD BINDING HELPER
// -----------------------------
function bindField(id, path) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener("input", () => {
    controller.updateField(path, el.value);
  });
}

  function bindCalculatedField(sourceId, targetId, transform) {
    const sourceEl = document.getElementById(sourceId);
    const targetEl = document.getElementById(targetId);

    if (!sourceEl || !targetEl) return;

    const sync = () => {
      const value = Number(sourceEl.value);
      if (!Number.isFinite(value)) {
        targetEl.value = "";
        controller.updateField("testParameters.pressure_inwc", "");
        return;
      }

      const computed = Number(transform(value).toFixed(2));
      targetEl.value = computed;
      controller.updateField("testParameters.pressure_inwc", computed);
    };

    sourceEl.addEventListener("input", sync);
    sourceEl.addEventListener("change", sync);
  }

  function bindOneDecimalDisplay(id, path) {
    const el = document.getElementById(id);
    if (!el) return;

    const sync = () => {
      if (el.value === "" || el.value === null || el.value === undefined) return;
      const parsed = Number(el.value);
      if (!Number.isFinite(parsed)) return;

      const formatted = parsed.toFixed(1);
      el.value = formatted;
      controller.updateField(path, formatted);
    };

    el.addEventListener("blur", sync);
    el.addEventListener("change", sync);

    // Normalize any prefilled value on initial load.
    sync();
  }

  function bindFileUpload(id, category) {
    const el = document.getElementById(id);
    if (!el) return;

    el.addEventListener("change", () => {
      const files = Array.from(el.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        controller.addPhoto(category, url);
      });
    });
  }

  failureBlock.style.display = fail ? "block" : "none";

// -----------------------------
// SAVE BUTTON
// -----------------------------
function clearValidationHighlights() {
  document.querySelectorAll(".fk-field-error").forEach(el => {
    el.classList.remove("fk-field-error");
  });
}

function highlightValidationErrors(errors) {
  clearValidationHighlights();

  const issuePaths = (errors || []).map(issue => issue.path || []);

  issuePaths.forEach(pathSegments => {
    if (!pathSegments.length) return;

    const fieldId = pathSegments[0];
    const control = document.getElementById(fieldId);
    if (!control) return;

    control.classList.add("fk-field-error");
  });
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  clearValidationHighlights();

  const finalSampleId = getFinalSampleId();
  if (!finalSampleId) {
    alert("System Type is required before saving so a Sample ID can be generated.");
    systemTypeEl?.classList.add("fk-field-error");
    return;
  }

  setSampleIdDisplay(finalSampleId);
  controller.updateField("sampleId", finalSampleId);

  let result;

  try {
    result = await controller.save();
  } catch (err) {
    console.error("Save failed", err);
    alert("Save failed due to an unexpected error. Check console for details.");
    return;
  }

  if (!result.success) {
    const issues = result.errors?.issues || [];
    highlightValidationErrors(issues);
    alert("Validation failed — check required fields.");
    console.error(result.errors);
    return;
  }

  const url = new URL("project.html", location.href);
  url.searchParams.set("projectId", projectId);
  url.searchParams.set("projectName", projectName);
  location.href = url.toString();
});
