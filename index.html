<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT Dashboard</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/bee-theme.css" />
  <script type="module" src="assets/js/nav.js"></script>
</head>
<body>

  <main class="fk-main">

    <!-- WEEK SCHEDULE (populated by ui-dashboard.js) -->
    <section id="week-schedule"></section>

    <!-- PROJECT LINK SELECTOR MODAL -->
    <div id="project-selector-overlay" class="event-detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="project-selector-title">
      <div class="event-detail-panel">
        <button class="event-detail-close" id="project-selector-close" aria-label="Close">&times;</button>
        <div class="event-detail-header">
          <div class="event-detail-title" id="project-selector-title">Link Event to Project</div>
        </div>
        <div class="project-selector-toolbar">
          <input
            id="project-selector-search"
            class="project-selector-search"
            type="search"
            placeholder="Search by project, ID, client, or address"
            aria-label="Search projects"
          >
        </div>
        <div id="project-selector-list" class="project-selector-list"></div>
      </div>
    </div>

    <!-- EVENT DETAIL MODAL -->
    <div id="event-detail-overlay" class="event-detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="event-detail-title">
      <div class="event-detail-panel">
        <button class="event-detail-close" id="event-detail-close" aria-label="Close">&times;</button>
        <div class="event-detail-header">
          <div class="event-detail-title" id="event-detail-title"></div>
          <div class="event-detail-meta" id="event-detail-meta"></div>
          <div class="event-detail-actions" id="event-detail-actions"></div>
        </div>
        <div class="event-detail-body" id="event-detail-body"></div>
        <div class="event-detail-footer" id="event-detail-footer"></div>
      </div>
    </div>

<script type="module" src="assets/js/ui-dashboard.js"></script>


</body>
</html>
