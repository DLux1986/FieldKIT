<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT Dashboard</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<div id="fk-floating-timers" class="fk-floating hidden">
  <div class="fk-floating-header">
    <span>Test Timers</span>
    <button id="fk-floating-close">×</button>
  </div>

  <iframe src="/tools/test-timers.html"></iframe>
</div>

<button id="fk-floating-open" class="fk-floating-open-btn">⏱️ Test Timers</button>

<body>

  <header class="fk-header">
    <h1>BEE ENGINEERS FieldKIT</h1>
  </header>

  <main class="fk-main">

    <!-- QUICK ACTIONS -->
    <section class="dashboard-grid">

      <a class="dash-card" href="project-catalog.html">
        <div class="dash-icon">📁</div>
        <div class="dash-title">Project Database</div>
      </a>

      <a class="dash-card" href="./tools/test-timers/test-timers.html">
        <div class="dash-icon">⏱️</div>
        <div class="dash-title">Test Timers</div>
      </a>

      <a class="dash-card" href="unit-converters.html">
        <div class="dash-icon">🔧</div>
        <div class="dash-title">Unit Converters</div>
      </a>

      <a class="dash-card" href="standards-library.html">
        <div class="dash-icon">📚</div>
        <div class="dash-title">Standards Library</div>
      </a>

      <a class="dash-card" href="sample-entry.html">
        <div class="dash-icon">📝</div>
        <div class="dash-title">Sample Entry</div>
      </a>

    </section>

    <!-- SCHEDULE -->

      <h2>Testing Schedule</h2>

      <div class="schedule-item">
        <div class="schedule-date">Mon 10/12</div>
        <div class="schedule-body">
          <div class="schedule-title">Window Test</div>
          <div class="schedule-location">Altera North</div>
          <div class="schedule-time">8:00am</div>
        </div>
      </div>

      <div class="schedule-item">
        <div class="schedule-date">Wed 10/14</div>
        <div class="schedule-body">
          <div class="schedule-title">Air Barrier Test</div>
          <div class="schedule-location">The Lofts – Mirkwood</div>
          <div class="schedule-time">11:00am</div>
        </div>
      </div>

<script type="module" src="assets/js/floating-timers.js"></script>

  </main>

</html>
