<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldKIT – Project</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/bee-theme.css">
  <script type="module" src="assets/js/ui-project.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
</head>

<body>

  <main class="fk-main">

    <!-- ACTION BUTTONS -->
    <section class="fk-project-actions">

      <button id="open-project-folder-btn">Open Folder</button>
      <button id="back-to-catalog-btn">Back to Catalog</button>
    </section>

    <!-- PROJECT DETAILS PANE -->
    <section id="project-details-pane" class="fk-details hidden">
      <h2 id="details-name"></h2>

      <p><strong>ID:</strong> <span id="details-id"></span></p>
      <p><strong>PM:</strong> <span id="details-pm"></span></p>
      <p><strong>Client:</strong> <span id="details-client"></span></p>
      <p><strong>Address:</strong> <span id="details-address"></span></p>
      <p><strong>Total Visits:</strong> <span id="details-visits"></span></p>

    </section>
      <button id="add-visit-btn">Add Visit</button>
    <!-- VISIT LIST -->
    <section id="visit-list"></section>

  </main>

  <!-- VISIT EDIT MODAL -->
  <div id="visit-edit-modal" class="fk-modal hidden">
    <div class="fk-modal-content">
      <h2>Edit Visit</h2>

      <label>Date</label>
      <input id="edit-visit-date" type="date">

      <label>Test Type</label>
      <select id="edit-visit-type">
        <option value="WT">WT</option>
        <option value="ABT">ABT</option>
        <option value="ELD">ELD</option>
      </select>

      <label>Notes</label>
      <textarea id="edit-visit-notes"></textarea>

      <h3>Personnel</h3>

      <label>Lead Technician</label>
      <select id="edit-lead-technician">
        <option value=""></option>
        <option value="Christopher Shafer">Christopher Shafer</option>
        <option value="Dave Luxmore">Dave Luxmore</option>
        <option value="Jack Welch">Jack Welch</option>
        <option value="Jesus Garcia">Jesus Garcia</option>
        <option value="Robert Smith">Robert Smith</option>
        <option value="Torin Garner">Torin Garner</option>
      </select>

      <label>Technician 2</label>
      <select id="edit-technician-2">
        <option value=""></option>
        <option value="Christopher Shafer">Christopher Shafer</option>
        <option value="Dave Luxmore">Dave Luxmore</option>
        <option value="Jack Welch">Jack Welch</option>
        <option value="Jesus Garcia">Jesus Garcia</option>
        <option value="Robert Smith">Robert Smith</option>
        <option value="Torin Garner">Torin Garner</option>
      </select>

      <h3>Witnesses</h3>

      <label>Witness Name 1</label>
      <input id="edit-witness-name-1" type="text">

      <label>Witness Name 2</label>
      <input id="edit-witness-name-2" type="text">

      <label>Witness Company 1</label>
      <input id="edit-witness-company-1" type="text">

      <label>Witness Company 2</label>
      <input id="edit-witness-company-2" type="text">

      <label>Witness Role 1</label>
      <input id="edit-witness-role-1" type="text">

      <label>Witness Role 2</label>
      <input id="edit-witness-role-2" type="text">

      <div class="fk-modal-actions">
        <button id="save-visit-btn">Save</button>
        <button id="cancel-visit-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR LINK MODAL -->
  <div id="calendar-link-modal" class="fk-modal hidden">
    <div class="fk-modal-content">
      <h2>Link Calendar Event</h2>

      <p id="calendar-link-event-title"></p>
      <p id="calendar-link-event-time"></p>

      <label>Assign to Project</label>
      <select id="calendar-link-project-select"></select>

      <div class="fk-modal-actions">
        <button id="calendar-link-save-btn">Save</button>
        <button id="calendar-link-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
